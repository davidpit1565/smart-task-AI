<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E14" />
    <meta name="description" content="Unknot — AI that untangles the task you're stuck on, in a design that feels like Apple built it" />

    <!-- Browser tab / desktop: SVG first (crisp at any size), PNG fallback for browsers without SVG favicon support. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />

    <!-- iOS "Add to Home Screen": Safari does not reliably support SVG here, so this must be a PNG.
         iOS also ignores the web manifest for standalone display/icon on older versions, hence the meta tags below. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unknot" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Unknot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
